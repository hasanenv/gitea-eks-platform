name: terraform

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
  push:
    branches:
      - main
    paths:
      - 'infra/terraform/**'

env:
  TF_VAR_github_repo: ${{ secrets.MY_REPO }}
  TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_owner: ${{ vars.OWNER }}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
  TF_VAR_cluster_name: ${{ secrets.CLUSTER_NAME }}
  TF_VAR_vpc_cidr: ${{ secrets.VPC_CIDR }}
  TF_VAR_public_subnets: ${{ secrets.PUBLIC_SUBNETS }}
  TF_VAR_private_subnets: ${{ secrets.PRIVATE_SUBNETS }}
  TF_VAR_azs: ${{ vars.AZS }}
  TF_VAR_eks_public_access_cidrs: ${{ secrets.EKS_PUBLIC_ACCESS_CIDRS }}
  TF_VAR_desired_size: ${{ vars.DESIRED_SIZE }}
  TF_VAR_max_size: ${{ vars.MAX_SIZE }}
  TF_VAR_min_size: ${{ vars.MIN_SIZE }}
  TF_VAR_instance_types: ${{ vars.INSTANCE_TYPES }}
  TF_VAR_capacity_type: ${{ vars.CAPACITY_TYPE }}
  TF_VAR_github_branch: ${{ vars.REPO_BRANCH }}
  TF_VAR_state_bucket_name: ${{ secrets.STATE_BUCKET_NAME }}
  TF_VAR_instance_class: ${{ vars.INSTANCE_CLASS }}
  TF_VAR_db_username: ${{ secrets.DB_USERNAME }}

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/terraform-plan-role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Terraform init
        working-directory: infra/terraform/envs/prod/
        run: terraform init

      - name: Terraform validate
        working-directory: infra/terraform/envs/prod/
        run: terraform validate

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: infra/terraform/
          quiet: true

      - name: Terraform plan
        working-directory: infra/terraform/envs/prod/
        run: terraform plan

  terraform-apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/terraform-apply-role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Terraform init
        working-directory: infra/terraform/envs/prod/
        run: terraform init

      - name: Terraform validate
        working-directory: infra/terraform/envs/prod/
        run: terraform validate

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: infra/terraform/
          quiet: true

      - name: Terraform plan
        working-directory: infra/terraform/envs/prod/
        run: terraform plan

      - name: Terraform apply
        working-directory: infra/terraform/envs/prod/
        run: terraform apply -auto-approve