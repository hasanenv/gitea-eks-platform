policy: sync
txtOwnerId: "gitea-eks"
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::727646481331:role/gitea-eks-platform-external-dns-role"
extraArgs:
  - --aws-zone-type=public