apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: cert-manager
    managed-by: argocd

spec: 
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  sources:
   - repoURL: oci://quay.io/jetstack/charts
     chart: cert-manager
     targetRevision: "v1.21.0"
     helm:
      valueFiles:
        - $values/infra/kubernetes/platform/cert-manager/values.yaml

   - repoURL: https://github.com/hasanenv/gitea-eks-platform
     targetRevision: HEAD
     ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true